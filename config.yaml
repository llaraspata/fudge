# Datasets and models (base LLMs) to test.
#
# The scripts use the `dataset` and `model` entries selected below. Pick others per run with
#   python main.py --dataset gyafc_fr --model marian_es_en --save_dir ckpt/...
# and point to a different config file with --config.
#
# Any key in an entry is used as the default for the script argument of the same name
# (task, data_dir, model_string, model_path, lr, batch_size, ...). Arguments given on the
# command line always win, and keys a script doesn't have an argument for are ignored.
#
# NOTE: the predictor is trained on the tokenizer of `model_string`, so train it (main.py)
# with the same model you then generate with (predict_*/evaluate_*).

dataset: gyafc_em
model: marian_es_en

datasets:
  gyafc_em:
    task: formality
    data_dir: train_data/GYAFC_Corpus/Entertainment_Music
  gyafc_fr:
    task: formality
    data_dir: train_data/GYAFC_Corpus/Family_Relationships
  rtp: # made by prepare_toxicity_data.py from RealToxicityPrompts prompts.jsonl
    task: toxicity
    data_dir: train_data/RealToxicityPrompts/processed
  topic:
    task: topic
    data_dir: train_data/gpt2_generations
    glove_file: train_data/glove.840B.300d.txt
  iambic:
    task: iambic
    data_dir: train_data/gpt2_generations
  rhyme:
    task: rhyme
    data_dir: train_data/gpt2_generations
  newline:
    task: newline
    data_dir: train_data/gpt2_generations

models:
  marian_es_en:
    model_string: Helsinki-NLP/opus-mt-es-en
  marian_es_en_fisher: # Marian finetuned on Fisher (evaluate_formality.py)
    model_string: Helsinki-NLP/opus-mt-es-en
    model_path: ckpt/formality/marian_finetune_fisher
  gpt2_medium:
    model_string: openai-community/gpt2-medium
  gpt2_large:
    model_string: openai-community/gpt2-large

  # Newer llm families: need the recent stack in .venv-new (setup.sh --new), read by recas/*.sh from `venv`.
  # Base (not instruct) models. Train one predictor per tokenizer: models of the same family share it.
  # Llama and Gemma are gated: accept their license on huggingface and log in (HF_TOKEN or `hf auth login`).
  llama32_1b:
    model_string: meta-llama/Llama-3.2-1B
    dtype: bfloat16
    venv: .venv-new
  llama32_3b:
    model_string: meta-llama/Llama-3.2-3B
    dtype: bfloat16
    venv: .venv-new
  gemma4_e2b:
    model_string: google/gemma-4-E2B
    dtype: bfloat16
    venv: .venv-new
  gemma4_e4b:
    model_string: google/gemma-4-E4B
    dtype: bfloat16
    venv: .venv-new
  qwen25_0_5b:
    model_string: Qwen/Qwen2.5-0.5B
    dtype: bfloat16
    venv: .venv-new
  qwen25_1_5b:
    model_string: Qwen/Qwen2.5-1.5B
    dtype: bfloat16
    venv: .venv-new
  qwen25_3b:
    model_string: Qwen/Qwen2.5-3B
    dtype: bfloat16
    venv: .venv-new
